#cloud-config
# Rendered by studio/src/lib/comfy/pod.ts. Contains secrets: never log or write to disk.
write_files:
  - path: /etc/comfy.env
    permissions: "0600"
    content: |
      TS_AUTHKEY='{{TS_AUTHKEY}}'
      TS_HOSTNAME='{{HOSTNAME}}'
      TS_TAGS='tag:comfy-pod'
      HF_TOKEN='{{HF_TOKEN}}'
      CIVITAI_TOKEN='{{CIVITAI_TOKEN}}'
      MODELS_GB='{{MODELS_GB}}'
  - path: /opt/comfy-install.sh
    permissions: "0755"
    encoding: b64
    content: {{INSTALL_B64}}
  - path: /opt/comfy/fetch-models.sh
    permissions: "0755"
    encoding: b64
    content: {{FETCH_B64}}
  - path: /opt/comfy-manifest.yaml
    permissions: "0644"
    encoding: b64
    content: {{MANIFEST_B64}}
  - path: /usr/local/bin/comfy-run
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Never start without a tailnet IP (an empty listen address would be public).
      ip=""
      for _ in $(seq 60); do
        ip=$(tailscale ip -4 2>/dev/null | head -n1)
        [ -n "$ip" ] && break
        sleep 2
      done
      [ -n "$ip" ] || { echo "no tailnet IP after 120s" >&2; exit 1; }
      cd /opt/comfy
      exec /opt/comfy/venv/bin/python main.py --listen "$ip" --port 8188 --disable-cuda-malloc
  - path: /etc/systemd/system/comfy-boot.service
    content: |
      [Unit]
      Description=Comfy pod bootstrap (idempotent, every boot)
      After=network-online.target tailscaled.service
      Wants=network-online.target tailscaled.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      Restart=on-failure
      RestartSec=15
      ExecStart=/opt/comfy-install.sh
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/comfy.service
    content: |
      [Unit]
      Description=ComfyUI (tailnet only)
      Requires=comfy-boot.service
      After=comfy-boot.service
      [Service]
      ExecStart=/usr/local/bin/comfy-run
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  # Chained: runcmd ignores failures, and a failed bootstrap or download must never come up as "ready".
  - [bash, -c, "systemctl enable --now comfy-boot.service && bash /opt/comfy/fetch-models.sh /opt/comfy-manifest.yaml && systemctl enable --now comfy.service"]
