[project]
name = "nai-tagger"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.20",
  "pillow>=11",
  "torch>=2.8",
  "torchvision>=0.23",
  "transformers==4.57.6",
  "timm>=1.0",
  "onnxruntime>=1.31.0",
  "huggingface-hub>=0.36.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]
