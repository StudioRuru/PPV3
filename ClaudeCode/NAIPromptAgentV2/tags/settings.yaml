  combat_effects:
    description: "Visual effects for action and combat scenes — motion, impact, energy"
    tags:
      - tag: "motion lines"
        notes: "Streaks showing movement direction. CRITICAL for action scenes — one of the most important action tags"
      - tag: "speed lines"
        notes: "Lines showing rapid motion. Often interchangeable with motion lines"
      - tag: "action lines"
        notes: "Lines emphasizing action/power radiating outward"
      - tag: "impact"
        notes: "Visual indication of a striking collision"
      - tag: "shockwave"
        notes: "Pressure wave radiating from point of impact"
      - tag: "explosion"
        notes: "Explosive blast effect"
      - tag: "sparks"
        notes: "Metal-on-metal spark particles. Essential for weapon clash scenes"
      - tag: "energy"
        notes: "Generic energy visual effect"
      - tag: "aura"
        notes: "Glowing energy field around character or weapon"
      - tag: "energy beam"
        notes: "Focused beam of energy"
      - tag: "light trail"
        notes: "Glowing path following movement of a weapon or projectile"
      - tag: "debris"
        notes: "Broken pieces flying from destruction"
      - tag: "destruction"
        notes: "Environmental/object destruction visible in scene"
      - tag: "slash mark"
        verified: false
        notes: "Visible cutting trail left by a blade. Hybrid — pair with sword slash for emphasis"
      - tag: "energy slash"
        verified: false
        notes: "Visible cutting arc of energy from a powerful attack. Hybrid — pair with motion lines"

  time_of_day:
    description: "Time and seasonal context"
    tags:
      - tag: "day"
      - tag: "night"
      - tag: "evening"
      - tag: "morning"
      - tag: "twilight"
      - tag: "midnight"
      - tag: "spring"
      - tag: "summer"
      - tag: "autumn"
      - tag: "winter"

  framing:
    description: "Shot composition and framing"
    tags:
      - tag: "portrait"
      - tag: "upper body"
      - tag: "lower body"
      - tag: "cowboy shot"
        notes: "Framed from mid-thigh up — most popular for outfit showcase"
      - tag: "full body"
      - tag: "close-up"
      - tag: "face close-up"
      - tag: "extreme close-up"
      - tag: "wide shot"
      - tag: "medium shot"
      - tag: "feet out of frame"
      - tag: "head out of frame"
      - tag: "cropped"
      - tag: "border"
      - tag: "letterboxed"
      - tag: "panorama"
      - tag: "split screen"
      - tag: "multiple views"
        notes: "Shows character from multiple angles — useful for outfit reference sheets"
      - tag: "2koma"
        notes: "Two-panel comic layout — core framing for before/after sequences (see data/genres/bimbodrain.yaml)"
      - tag: "comic"
        notes: "Multi-panel comic layout"
      - tag: "before and after"
        notes: "Side-by-side contrast of two states of the same subject. Pair with '2koma' for a defeat/transformation reveal"

  art_style:
    description: "Art style and rendering tags"
    tags:
