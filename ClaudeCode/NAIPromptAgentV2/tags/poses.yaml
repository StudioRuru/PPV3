meta:
  category: "poses"
  description: "Pose, camera angle, expression, and action tags for NovelAI V4.5"

subcategories:
  standing:
    description: "Standing poses and stances"
    tags:
      - tag: "standing"
      - tag: "standing on one leg"
      - tag: "leaning forward"
      - tag: "leaning back"
      - tag: "leaning to the side"
      - tag: "hand on hip"
      - tag: "hands on hips"
      - tag: "hand on lower back"
        notes: "Touch placement on lower back — useful for two-character contact poses"
      - tag: "bent over"
        notes: "Torso bent forward at waist — exposing pose"
      - tag: "presenting"
        notes: "Active 'showing' stance — hips/chest forward"
      - tag: "arms at sides"
      - tag: "arms behind back"
      - tag: "arms behind head"
      - tag: "arms crossed"
      - tag: "arms up"
      - tag: "hand on own chest"
      - tag: "hand on own cheek"
      - tag: "hand on own chin"
      - tag: "hands in pockets"
      - tag: "hand up"
      - tag: "hand to own mouth"
      - tag: "finger to mouth"
        notes: "Index finger touching lips"
      - tag: "peace sign"
      - tag: "v"
        notes: "V sign / peace sign with hand"
      - tag: "contrapposto"
        notes: "Weight shifted to one leg, classic elegant stance"
      - tag: "model pose"
      - tag: "head tilt"
      - tag: "hair flip"

  sitting:
    description: "Sitting and reclining poses"
    tags:
      - tag: "sitting"
      - tag: "sitting on chair"
      - tag: "sitting on bed"
      - tag: "sitting on floor"
      - tag: "crossed legs"
      - tag: "indian style"
        notes: "Cross-legged sitting on floor"
      - tag: "seiza"
        notes: "Japanese formal sitting on knees"
      - tag: "wariza"
        aliases: ["w-sitting"]
        notes: "Sitting with legs to the sides"
      - tag: "hugging own legs"
      - tag: "knees up"
      - tag: "knees together feet apart"
      - tag: "legs together"
      - tag: "spread legs"
      - tag: "side-sit"

  lying:
    description: "Lying down and reclining poses"
    tags:
      - tag: "lying"
      - tag: "on back"
      - tag: "on stomach"
      - tag: "on side"
      - tag: "reclining"
      - tag: "fetal position"
      - tag: "sprawling"
      - tag: "propped up"
      - tag: "on the floor"
        notes: "Collapsed/seated on the ground — dignity-loss pose for defeat scenes"
      - tag: "collapsed"
        notes: "Fallen down, drained of strength. Hybrid — pair with 'on the floor' or 'lying'"

  kneeling:
    description: "Kneeling poses"
    tags:
      - tag: "kneeling"
      - tag: "on one knee"
      - tag: "all fours"

  dynamic:
    description: "Action and movement poses"
    tags:
      - tag: "walking"
      - tag: "running"
      - tag: "jumping"
      - tag: "falling"
      - tag: "floating"
      - tag: "flying"
      - tag: "dancing"
      - tag: "stretching"
      - tag: "feet up"
        notes: "Feet raised in frame — foot-focus pose"
      - tag: "reaching"
      - tag: "pointing"
      - tag: "fighting stance"
      - tag: "action"
      - tag: "dynamic pose"
      - tag: "twisting"
      - tag: "spinning"
      - tag: "kick"
      - tag: "punch"

  combat:
    description: "Combat-specific poses, stances, and weapon actions"
    tags:
      - tag: "battle"
        notes: "General combat context"
      - tag: "duel"
        notes: "One-on-one combat"
      - tag: "combat stance"
        notes: "Ready position for fighting"
      - tag: "sword slash"
        notes: "Slashing attack with a sword. Verified — high-impact action tag"
      - tag: "sword swing"
        notes: "Broad swinging motion with blade"
      - tag: "blocking"
        notes: "Character defending against an incoming attack"
      - tag: "parrying"
        notes: "Deflecting an incoming attack with a weapon"
      - tag: "dodge"
        notes: "Evading an attack"
      - tag: "lunging"
        notes: "Forward thrusting attack"
      - tag: "overhead strike"
        notes: "Weapon raised and swinging downward"
      - tag: "weapon clash"
        verified: false
        notes: "Two weapons colliding mid-strike. Hybrid — pair with sparks and impact effects"
      - tag: "weapon break"
        verified: false
        notes: "Weapon being destroyed by a powerful strike. Hybrid — pair with 'broken weapon' for grounding"
      - tag: "guard break"
        verified: false
        notes: "Defense being overwhelmed and shattered. Hybrid — pair with 'blocking' + 'broken weapon'"
      - tag: "knocked back"
        verified: false
        notes: "Character being pushed backward by force. Hybrid — pair with impact effects"
      - tag: "staggering"
        verified: false
        notes: "Reeling from a hit, off-balance. Hybrid — good for aftermath poses"
      - tag: "bracing"
        verified: false
        notes: "Preparing to receive an impact. Hybrid — pair with defensive stance tags"

  camera_angle:
    description: "Viewer perspective and camera angles"
    tags:
      - tag: "from above"
      - tag: "from below"
      - tag: "from side"
      - tag: "from behind"
      - tag: "from front"
      - tag: "dutch angle"
        notes: "Tilted camera for dramatic effect"
      - tag: "looking at viewer"
      - tag: "looking away"
      - tag: "looking back"
      - tag: "looking up"
      - tag: "looking down"
      - tag: "looking to the side"
      - tag: "over shoulder"
      - tag: "pov"
        notes: "First-person point of view"
      - tag: "eye contact"
      - tag: "facing away"
      - tag: "turned head"
      - tag: "profile"
        notes: "Side view of face"
      - tag: "three-quarter view"

  expressions:
    description: "Facial expressions and emotions"
    tags:
      - tag: "smile"
      - tag: "grin"
      - tag: "smirk"
      - tag: "smug"
        notes: "Self-satisfied, superior expression — core 'before' face for defeat/humbling arcs"
      - tag: "condescending"
        notes: "Looking down on someone with contempt. Hybrid — pair with 'smug' + 'looking down'"
      - tag: "open mouth"
      - tag: "closed mouth"
      - tag: "parted lips"
      - tag: "tongue out"
      - tag: "ahegao"
        notes: "Open-mouth, eyes-up pleasure-broken face — core 'intelligence loss' expression"
      - tag: "torogao"
        notes: "Melting/entranced expression dissolving in pleasure or daze"
      - tag: "fucked silly"
        notes: "Mind-broken from pleasure. Pair with 'ahegao' + 'rolling eyes' + 'drooling'"
      - tag: "naughty face"
        notes: "Lewd, leering grin — fits bimbofication/aroused flavors"
      - tag: "drooling"
        notes: "Saliva escaping the mouth — loss of self-control"
      - tag: "saliva"
        notes: "Visible saliva. Pair with 'drooling' or 'tongue out'"
      - tag: "saliva trail"
        notes: "Thin trail of saliva from mouth/tongue"
      - tag: "body blush"
        notes: "Reddish flush across the body, not just the face"
      - tag: "blush"
      - tag: "embarrassed"
      - tag: "angry"
      - tag: "annoyed"
      - tag: "sad"
      - tag: "crying"
      - tag: "tears"
      - tag: "surprised"
      - tag: ":o"
        notes: "Surprised/small open mouth expression"
      - tag: "expressionless"
      - tag: "serious"
      - tag: "determined"
      - tag: "sleepy"
      - tag: "closed eyes"
      - tag: "one eye closed"
      - tag: "wink"
      - tag: ";)"
      - tag: "half-closed eyes"
      - tag: "lidded eyes"
      - tag: "shy"
      - tag: "nervous"
      - tag: "scared"
      - tag: "happy"
      - tag: "laughing"
      - tag: "pout"
      - tag: "frown"
      - tag: "seductive smile"
      - tag: "evil smile"
      - tag: "gentle smile"
      - tag: "confident"

  gaze_and_interaction:
    description: "Where the character is looking and interacting"
    tags:
      - tag: "looking at viewer"
      - tag: "eye contact"
      - tag: "staring"
      - tag: "glaring"
      - tag: "bedroom eyes"
      - tag: "heart eyes"
      - tag: "sparkling eyes"
      - tag: "teardrop"
      - tag: "sweatdrop"
