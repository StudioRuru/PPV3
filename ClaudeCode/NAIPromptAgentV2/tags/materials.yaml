      - tag: "animal print"
      - tag: "tartan"
      - tag: "gingham"
      - tag: "houndstooth"
      - tag: "paisley"
      - tag: "star print"
      - tag: "heart print"
      - tag: "skull print"

  textures_effects:
    description: "Visual effects, conditions, and fit modifiers for clothing"
    tags:
      - tag: "see-through"
      - tag: "wet"
      - tag: "wet clothes"
      - tag: "torn"
      - tag: "torn clothes"
      - tag: "distressed"
      - tag: "frilled"
      - tag: "ruffled"
        aliases: ["ruffle"]
      - tag: "layered"
        aliases: ["layered clothes"]
      - tag: "oversized"
        aliases: ["oversized clothes"]
      - tag: "tight"
        aliases: ["tight clothes"]
      - tag: "skin tight"
      - tag: "form-fitting"
      - tag: "taut clothes"
        notes: "Stretched-tight by chest/body — implies strain on fabric. Distinct from 'tight' (size) and 'skin tight' (fit)"
