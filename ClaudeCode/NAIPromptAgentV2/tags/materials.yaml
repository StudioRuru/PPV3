      - tag: "unbuttoned"
      - tag: "unzipped"
      - tag: "open clothes"
      - tag: "partially undressed"
      - tag: "clothes lift"
      - tag: "clothes pull"

  colors:
    description: "Color modifiers applied to clothing and accessories"
    tags:
      - tag: "black"
      - tag: "white"
      - tag: "red"
      - tag: "blue"
      - tag: "pink"
      - tag: "purple"
      - tag: "green"
