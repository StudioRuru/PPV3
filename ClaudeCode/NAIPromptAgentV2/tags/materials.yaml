      - tag: "gradient"
      - tag: "two-tone"
      - tag: "pastel"
        notes: "Used as modifier, e.g. pastel colors"
      - tag: "aqua"
      - tag: "light blue"
      - tag: "dark blue"
      - tag: "light purple"
      - tag: "light pink"
      - tag: "dark skin"
        notes: "Skin color modifier, not clothing"
