meta:
  category: "materials"
  description: "Fabric types, textures, patterns, and color modifiers"

subcategories:
  fabrics:
    description: "Fabric and material types used in clothing"
    tags:
      - tag: "lace"
      - tag: "lace trim"
      - tag: "silk"
      - tag: "denim"
      - tag: "leather"
      - tag: "latex"
      - tag: "cotton"
      - tag: "velvet"
      - tag: "satin"
      - tag: "sheer"
        aliases: ["sheer clothes"]
      - tag: "mesh"
      - tag: "chiffon"
      - tag: "fur trim"
      - tag: "feathers"
      - tag: "sequins"
      - tag: "rubber"
      - tag: "spandex"
      - tag: "wool"
      - tag: "knit"
        aliases: ["knitted"]
      - tag: "crochet"
      - tag: "tulle"
      - tag: "fur"
      - tag: "fishnet"
