        notes: "PVC fabric — adjacent to vinyl/latex aesthetic"

  patterns:
    description: "Clothing patterns and prints"
    tags:
      - tag: "plaid"
      - tag: "striped"
      - tag: "polka dot"
      - tag: "floral print"
      - tag: "argyle"
      - tag: "checkered"
