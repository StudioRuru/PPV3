# Generate the Xcode project with `xcodegen` (ios/build.sh does it). Sideload only — never App Store.
name: NAIStudio
options:
  bundleIdPrefix: com.philly95
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9TL96DXFPC
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NAIStudio:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: NAIStudioShare
      - target: NAIStudioWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philly95.naistudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    entitlements:
      path: App/NAIStudio.entitlements
      properties:
        com.apple.security.application-groups: [group.com.philly95.naistudio]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Studio
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryAddUsageDescription: Save generations to your photo library.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.philly95.naistudio
            CFBundleURLSchemes: [naistudio]
  NAIStudioShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared/Inbox.swift]   # not Shared/Activity: that's the app + widget only
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philly95.naistudio.share
    entitlements:
      path: Share/NAIStudioShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.philly95.naistudio]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Tag in Studio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
  NAIStudioWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared/Activity]   # never Shared/Inbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philly95.naistudio.widgets
    entitlements:
      path: Widgets/NAIStudioWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.philly95.naistudio]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Miyabi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
